name: ⚡ Optimized Telegram

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message'
        required: true
        default: 'Hello'
        type: string
  
  repository_dispatch:
    types: [php-trigger, fast-send]

env:
  BOT_TOKEN: "7390930576:AAElDcVtAW7r9q7xAgzLSJuBzbxBnp0KPsA"
  CHAT_ID: "-4838772734"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    
    steps:
    - name: Fast Processing
      id: process
      run: |
        # Fast message extraction
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "INPUT=${{ github.event.inputs.message }}" >> $GITHUB_OUTPUT
          echo "SOURCE=GitHub" >> $GITHUB_OUTPUT
        else
          echo "INPUT=${{ github.event.client_payload.message }}" >> $GITHUB_OUTPUT
          echo "SOURCE=${{ github.event.client_payload.source || 'Web' }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Lightning Send
      run: |
        # Use outputs directly with minimal formatting
        curl -s --max-time 8 \
          -X POST \
          -H "Content-Type: application/json" \
          -d "{
            \"chat_id\": \"$CHAT_ID\",
            \"text\": \"${{ steps.process.outputs.SOURCE }}: ${{ steps.process.outputs.INPUT }}\n$(date '+%H:%M:%S')\",
            \"parse_mode\": \"HTML\"
          }" \
          "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
        
        echo "⚡ Sent in under 10s total"
