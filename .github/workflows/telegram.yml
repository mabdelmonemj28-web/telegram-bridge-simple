name: Telegram Bridge

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message'
        required: true
        default: 'Hello'
        type: string
  
  repository_dispatch:
    types: [php-trigger, webhook]

env:
  BOT_TOKEN: "7390930576:AAElDcVtAW7r9q7xAgzLSJuBzbxBnp0KPsA"
  CHAT_ID: "-4838772734"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Get Message
        id: get-message
        run: |
          # For manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "message=${{ github.event.inputs.message }}" >> $GITHUB_OUTPUT
            echo "source=GitHub UI" >> $GITHUB_OUTPUT
          
          # For webhook trigger
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "message=${{ github.event.client_payload.message }}" >> $GITHUB_OUTPUT
            echo "source=${{ github.event.client_payload.source || 'Webhook' }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Send to Telegram
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ env.CHAT_ID }}\",
              \"text\": \"📡 From: ${{ steps.get-message.outputs.source }}\\n\\n💬 ${{ steps.get-message.outputs.message }}\\n\\n⏰ $(date)\\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"parse_mode\": \"HTML\"
            }" \
            "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage"
